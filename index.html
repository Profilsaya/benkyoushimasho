(function () {

.ch{display:block;width:100%;text-align:left;margin:0 0 10px;min-height:50px;height:auto;padding:12px 16px;line-height:1.45}.okc{border-color:var(--ok);background:rgba(47,158,68,.14)}.noc{border-color:var(--no);background:rgba(224,49,49,.12)}
canvas{width:100%;max-width:320px;aspect-ratio:1;background:#fff;border-radius:18px;border:1px solid var(--bd);touch-action:none;display:block;margin:0 auto 12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;gap:2px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--bd);box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:40}

.dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--no);color:#fff;font-size:10px;font-style:normal;line-height:17px;padding:0 4px}
.mrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin:0 0 10px;padding:14px;height:auto;line-height:1.4}.mrow svg{width:26px;height:26px;stroke:var(--pr)}`;
const host = document.getElementById('irodori-host'), R = host.attachShadow({ mode: 'open' });
R.innerHTML = `<style>${CSS}</style><div id="shell"><header id="hd">Irodori</header><main id="v"></main><nav id="nav"></nav><div id="m"></div></div>`;
const $ = id => R.getElementById(id);
// ====== KONFIGURASI: tempel URL Web App Apps Script (berakhiran /exec) ======
const API_URL = 'https://script.google.com/macros/s/AKfycbw-2oEVc96DWzxAhxEBOyE1y2SONmi5PMiAjYQtwQJ3CYEHkvGV1CEQyVLogA3yVa1qWg/exec';
const GOOGLE_CLIENT_ID = 'GANTI_DENGAN_GOOGLE_CLIENT_ID';   // opsional; kosongkan = login Google disembunyikan
// ===========================================================================
const E = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(action, data) {
  if (API_URL.startsWith('GANTI')) throw new Error('API_URL belum diisi di index.html');
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, data, token: S.auth?.token }) });
  const j = await r.json(); if (!j.ok) { const e = new Error(j.error.message); e.code = j.error.code; throw e; } return j.data;
}
// ---- IndexedDB (data Guest) ----
const idb = new Promise((res, rej) => {
  const q = indexedDB.open('irodori', 1);
  q.onupgradeneeded = () => { q.result.createObjectStore('kv', { keyPath: 'k' }); q.result.createObjectStore('answers', { keyPath: 'answerId' }); };
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
});
const tx = async (st, mode, fn) => { const d = await idb; return new Promise((res, rej) => { const t = d.transaction(st, mode), r = fn(t.objectStore(st)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
const kvGet = async k => (await tx('kv', 'readonly', s => s.get(k))) ?.v;
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put({ k, v }));
// ---- State ----
const S = { tab: 'home', books: [], sel: [], words: {}, bab: '', cat: '', q: '', marks: {}, favs: {}, shown: 80, err: '', loading: true,
            F: { deck: [], i: 0, flip: false, shuffle: false } };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const sessionId = 'g-' + uid().slice(0, 12);
async function init() {
  S.marks = (await kvGet('marks')) || {}; S.favs = (await kvGet('favs')) || {}; S.stat = (await kvGet('stat')) || {}; S.hist = (await kvGet('hist')) || []; S.target = (await kvGet('target')) || 20;
  S.ans = (await tx('answers', 'readonly', st => st.getAll())) || []; S.prog = {};
  S.auth = (await kvGet('auth')) || null; S.owner = (await kvGet('owner')) || null; S.sprog = (await kvGet('sprog')) || null; S.favOff = (await kvGet('favoff')) || {};
  S.set = (await kvGet('set')) || S.set; S.setTs = (await kvGet('setts')) || 0; S.Q.cfg.n = S.set.n; S.Q.cfg.mode = S.set.mode; applyTheme(); rebuildProg();
  try {
    const ver = (await api('getBooks'));
    S.books = ver.books; S.sel = ver.books.filter(b => b.count > 0).slice(-1).map(b => b.id);
    const sv = await kvGet('sel'); if (sv && sv.every(id => ver.books.some(b => b.id === id && b.count))) S.sel = sv;
    await loadWords();
  } catch (e) { S.err = e.message; }
  S.loading = false; render(); if (S.auth) syncNow(true);
}
async function loadWords() {
  for (const b of S.sel) if (!S.words[b]) S.words[b] = (await api('getWords', { books: [b] })).words;
}
const cur = () => S.sel.flatMap(b => S.words[b] || []);
const babs = () => [...new Set(cur().map(w => w.bab))].sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
const cats = () => [...new Set(cur().map(w => w.kategori))].sort();
function filtered() {
  const q = S.q.trim().toLowerCase();
  return cur().filter(w => (!S.bab || w.bab === S.bab) && catOK(w) &&
    (!q || w.kanji.toLowerCase().includes(q) || w.furi.toLowerCase().includes(q) || w.arti.toLowerCase().includes(q)));
}
const byId = id => Object.values(S.words).flat().find(w => w.id === id);
async function mark(id, type) {
  S.marks[id] = type; await kvSet('marks', S.marks);
  await addAns({ answerId: uid(), wordId: id, benar: type === 'm', ts: Date.now(), jenis: 'kartu', manual: type === 'm' ? 'mastered' : 'review', sessionId });
}
async function fav(id) { const t = Date.now(); if (S.favs[id]) { delete S.favs[id]; S.favOff[id] = t; } else { S.favs[id] = t; delete S.favOff[id]; } await kvSet('favs', S.favs); await kvSet('favoff', S.favOff); autoSync(); }
// ---- Spaced Repetition (sama dengan backend) ----
const DAY = 864e5, IV = [10 / 1440, 1, 3, 7, 14, 30, 60];
const srsNew = () => ({ correct: 0, wrong: 0, streak: 0, level: 0, lastTs: 0, nextReview: 0, mastery: 'baru', events: 0 });
function srsApply(st, ev) {
  const s = { ...st }; s.events++; s.lastTs = Math.max(s.lastTs, ev.ts);
  if (ev.manual === 'mastered') { s.level = Math.max(s.level, 4); s.streak = Math.max(s.streak, 3); s.nextReview = ev.ts + IV[s.level] * DAY; }
  else if (ev.manual === 'review') { s.level = 0; s.streak = 0; s.nextReview = ev.ts + IV[0] * DAY; }
  else if (ev.ok) { s.correct++; s.streak++; s.level = Math.min(s.level + 1, 6); const t = s.correct + s.wrong, a = s.correct / t, f = t < 3 ? 1 : a < .6 ? .7 : a >= .9 ? 1.2 : 1; s.nextReview = ev.ts + IV[s.level] * f * DAY; }
  else { s.wrong++; s.streak = 0; s.level = Math.max(s.level - 2, 0); s.nextReview = ev.ts + IV[0] * DAY; }
  s.mastery = s.level >= 4 && s.streak >= 3 ? 'dikuasai' : s.level >= 2 ? 'berkembang' : s.level === 1 && s.wrong === 0 ? 'baru' : 'perlu_diulang';
  return s;
}
function addAns(ev) { autoSync(); S.ans.push(ev); S.prog[ev.wordId] = srsApply(S.prog[ev.wordId] || srsNew(), { ok: ev.benar, ts: ev.ts, manual: ev.manual || '' }); return tx('answers', 'readwrite', st => st.put(ev)); }
async function loadAll() { for (const b of S.books) if (b.count && !S.words[b.id]) S.words[b.id] = (await api('getWords', { books: [b.id] })).words; }
const MS = { baru: 'Baru dipelajari', perlu_diulang: 'Perlu diulang', berkembang: 'Sedang berkembang', dikuasai: 'Dikuasai' };
const status = id => ({ m: 'Dikuasai', r: 'Perlu diulang' }[S.marks[id]] || 'Belum ditandai');
const hl = w => { const s = w.kalimat; if (w.tk && s.includes(w.tk)) { const i = s.indexOf(w.tk); return E(s.slice(0, i)) + '<mark>' + E(w.tk) + '</mark>' + E(s.slice(i + w.tk.length)); } return E(s); };
// ---- Tampilan ----
function filters() {
  return `<div class="card"><div class="chips">${S.books.map(b => `<button class="${S.sel.includes(b.id) ? 'on' : ''}" data-a="book" data-v="${b.id}" ${b.count ? '' : 'disabled'}>${E(b.label)}${b.count ? '' : ' (kosong)'}</button>`).join('')}</div>
  <div class="mu" style="margin-bottom:6px">Pilih satu atau beberapa buku untuk gabungan.</div>
  <select data-a="bab"><option value="">Semua bab</option>${babs().map(b => `<option ${S.bab === b ? 'selected' : ''}>${b}</option>`).join('')}</select>
  ${catUI()}
  <input id="q" placeholder="Cari kanji, furigana, atau arti" value="${E(S.q)}"></div>`;
}
function vHome() {
  const P = Object.values(S.prog).filter(x => x.events > 0), now = Date.now(), qa = S.ans.filter(a => !a.manual), ok = qa.filter(a => a.benar).length;
  const due = P.filter(x => x.nextReview <= now).length, td = new Date().toDateString(), done = S.ans.filter(a => new Date(a.ts).toDateString() === td).length;
  const pct = Math.min(100, Math.round(done / S.target * 100));
  return `<div class="grid"><div class="card"><div class="num">${P.length}</div><div class="mu">Kotoba dipelajari</div></div>
  <div class="card"><div class="num">${P.filter(x => x.mastery === 'dikuasai').length}</div><div class="mu">Dikuasai</div></div>
  <div class="card"><div class="num">${qa.length ? Math.round(ok / qa.length * 100) + '%' : '–'}</div><div class="mu">Akurasi latihan</div></div>
  <div class="card"><div class="num">${due}</div><div class="mu">Perlu diulang hari ini</div></div></div>
  <div class="card"><b>Target harian</b><div class="row" style="align-items:center"><span>${done} / ${S.target} aktivitas hari ini</span><span style="flex:0 0 auto"><button data-a="tg" data-v="-5">−</button> <button data-a="tg" data-v="5">+</button></span></div>${bar(0, pct)}</div>
  <div class="row"><button class="p" data-a="tab" data-v="card">Mulai belajar</button><button class="p" data-a="tab" data-v="quiz">Mulai latihan</button></div>
  <div class="row" style="margin-bottom:12px"><button data-a="tab" data-v="review">Review (${due})</button></div>
  <div class="card"><b>Aktivitas terakhir</b>${S.hist.slice(-5).reverse().map(h => `<div class="item" style="cursor:default"><span>${new Date(h.ts).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })}<div class="sm">${h.source === 'review' ? 'Review' : h.mode} · ${E(h.jenis)}</div></span><b>${Math.round(h.benar / h.total * 100)}%</b></div>`).join('') || '<p class="mu">Belum ada latihan.</p>'}</div>
  <div class="card mu">Mode Guest: progres tersimpan di browser ini. Menghapus data situs/browser dapat menghapus progres. Buka Statistik untuk mengekspor cadangan.</div>`;
}
function vMateri() { return filters() + '<div id="lst">' + listHTML() + '</div>'; }
function listHTML() {
  const l = filtered();
  return `<div class="mu" style="margin:0 4px 8px">${l.length} kotoba</div><div class="card" style="padding:4px 14px">${l.slice(0, S.shown).map(w =>
    `<div class="item" data-a="det" data-v="${w.id}"><div><span class="jp">${E(w.kanji)}</span><div class="sm">${E(w.furi)} · ${E(w.arti)}</div></div><span class="tag">${S.favs[w.id] ? '★ ' : ''}${w.bab}</span></div>`).join('') || '<p class="mu">Tidak ada hasil.</p>'}
  ${l.length > S.shown ? '<button style="width:100%;margin:10px 0" data-a="more">Tampilkan lebih banyak</button>' : ''}</div>`;
}
function buildDeck() {
  const ids = filtered().map(w => w.id);
  if (S.F.shuffle) for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  S.F.deck = ids; S.F.i = 0; S.F.flip = false;
}
function vCard() { return filters() + '<div id="cb">' + cardBody() + '</div>'; }
function cardBody() {
  const F = S.F, w = byId(F.deck[F.i]);
  const top = `<div class="row" style="margin-bottom:10px"><button class="${F.shuffle ? 'on' : ''}" data-a="shuf">Acak ${F.shuffle ? 'aktif' : 'mati'}</button><button data-a="deck">Susun ulang kartu</button></div>`;
  if (!w) return top + '<div class="card mu">Tidak ada kartu. Ubah filter lalu tekan "Susun ulang kartu".</div>';
  return top + `<div class="mu" style="text-align:center;margin-bottom:6px">${F.i + 1} / ${F.deck.length} · ${status(w.id)}</div>
  <div class="fc"><div class="fci ${F.flip ? 'f' : ''}" data-a="flip"><div class="face"><div class="big">${E(w.kanji)}</div><div class="mu" style="margin-top:10px">Ketuk untuk membalik</div></div>
  <div class="face back"><div class="jp">${E(w.furi)}</div><div style="margin:6px 0;font-weight:600">${E(w.arti)}</div><span class="tag">${E(w.kategori)}</span>
  <div style="margin-top:10px">${hl(w)}</div><div class="sm">${E(w.furiKalimat)}</div><div class="sm">${E(w.artiKalimat)}</div></div></div></div>
  <div class="row"><button data-a="prev" ${F.i ? '' : 'disabled'}>◀ Sebelumnya</button><button data-a="next" ${F.i < F.deck.length - 1 ? '' : 'disabled'}>Berikutnya ▶</button></div>
  <div class="row"><button data-a="mk" data-v="m" class="${S.marks[w.id] === 'm' ? 'on' : ''}">✓ Sudah dikuasai</button><button data-a="mk" data-v="r" class="${S.marks[w.id] === 'r' ? 'on' : ''}">↻ Perlu diulang</button></div>
  <div class="row"><button data-a="favc" class="${S.favs[w.id] ? 'on' : ''}">${S.favs[w.id] ? '★ Favorit' : '☆ Tandai favorit'}</button></div>`;
}
function detail(id) {
  const w = byId(id); if (!w) return;
  $('m').innerHTML = `<div class="modal" data-a="close"><div class="sheet"><div class="jp" style="font-size:34px">${E(w.kanji)}</div>
  <div>${E(w.furi)}</div><p><b>${E(w.arti)}</b></p><span class="tag">${E(w.kategori)}</span> <span class="tag">${w.id}</span> <span class="tag">${status(w.id)}</span>
  <p>${hl(w)}</p><div class="sm">${E(w.furiKalimat)}</div><div class="sm">${E(w.artiKalimat)}</div>
  <div class="row"><button data-a="dm" data-v="${w.id}|m">✓ Dikuasai</button><button data-a="dm" data-v="${w.id}|r">↻ Perlu diulang</button></div>
  <div class="row"><button data-a="df" data-v="${w.id}">${S.favs[w.id] ? '★ Hapus favorit' : '☆ Favorit'}</button><button data-a="close">Tutup</button></div></div></div>`;
}
// ---- Latihan soal ----
const JN = { arti: 'Arti kotoba', furigana: 'Furigana', kanji: 'Kanji', kalimat: 'Contoh kalimat', tulis: 'Menulis kanji' };
S.Q = { cfg: { jenis: ['arti'], n: '10', custom: '', per: false, mode: 'latihan', prio: false, from: '', to: '' }, run: null, msg: '' };
const sh = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const bn = b => parseInt(b.slice(1));
function opts(w, key, all) {   // pengecoh: kategori sama, bukan jawaban benar, tanpa duplikat
  const seen = new Set([w[key]]), out = [];
  for (const x of sh(all.filter(x => x.kategori === w.kategori && x.id !== w.id && (key !== 'kanji' || x.hk)))) {
    if (x[key] && !seen.has(x[key])) { seen.add(x[key]); out.push(x[key]); if (out.length === 3) break; }
  }
  return out.length >= 2 ? sh([w[key], ...out]) : null;   // minimal 3 pilihan, jika kurang soal dilewati
}
function mkQ(w, t, all) {
  if (t === 'tulis') return w.hk ? { t, id: w.id, prompt: w.arti + ' / ' + w.furi, ans: w.kanji } : null;
  if (t === 'kalimat' && !w.tk) return null;
  if ((t === 'furigana' || t === 'kanji') && !w.hk) return null;
  if (t === 'furigana') { const fo = furiOpts(w.furi); if (fo) return { t, id: w.id, o: fo, ans: w.furi, prompt: w.kanji }; }
  const key = { arti: 'arti', furigana: 'furi', kanji: 'kanji', kalimat: 'arti' }[t], o = opts(w, key, all);
  return o ? { t, id: w.id, o, ans: w[key], prompt: t === 'kanji' ? w.arti + ' / ' + w.furi : w.kanji } : null;

// ---- Pengecoh furigana: bacaan benar diacak (hanya hiragana), akhiran tetap sama ----
const KROW = ['あいうえお', 'かきくけこ', 'がぎぐげご', 'さしすせそ', 'ざじずぜぞ', 'たちつてと', 'だぢづでど', 'なにぬねの', 'はひふへほ', 'ばびぶべぼ', 'ぱぴぷぺぽ', 'まみむめも', 'らりるれろ', 'やゆよ', 'わを'];
const VOI = [['かきくけこ', 'がぎぐげご'], ['さしすせそ', 'ざじずぜぞ'], ['たちつてと', 'だぢづでど'], ['はひふへほ', 'ばびぶべぼ']];
const rnd = n => Math.floor(Math.random() * n), pick = a => a[rnd(a.length)];
function mutateKana(c) {
  c = c.slice(); const op = rnd(6), i = rnd(c.length), ch = c[i];
  if (op === 0) { const k = c.findIndex((x, j) => j > 0 && 'ういー'.includes(x)); if (k > 0) { c.splice(k, 1); return c; } if (c.length > 2) { c.splice(i, 1); return c; } return null; }
  if (op === 1) { c.splice(i + 1, 0, pick(['う', 'い', 'っ', 'ん'])); return c; }
  if (op === 2) { const sm = 'ゃゅょ', fu = 'やゆよ', a = sm.indexOf(ch), b = fu.indexOf(ch); if (a >= 0) { c[i] = Math.random() < .5 ? fu[a] : sm[(a + 1 + rnd(2)) % 3]; return c; } if (b >= 0 && i > 0) { c[i] = sm[b]; return c; } return null; }
  if (op === 3) { for (const [u, v] of VOI) { const k = u.indexOf(ch); if (k >= 0) { c[i] = v[k]; return c; } const k2 = v.indexOf(ch); if (k2 >= 0) { c[i] = u[k2]; return c; } } return null; }
  if (op === 4) { const row = KROW.find(r => r.includes(ch)); if (!row) return null; c[i] = pick([...row].filter(x => x !== ch)); return c; }
  if (c.length > 1 && i < c.length - 1 && c[i] !== c[i + 1]) { [c[i], c[i + 1]] = [c[i + 1], c[i]]; return c; }
  return null;
}
function furiOpts(f) {
  if (f.replace(/^[～~〜]/, '').length < 2) return null;   // bacaan 1 huruf: pakai pengecoh dari kata lain
  let pre = '', body = f;
  if (/^[～~〜]/.test(body)) { pre = body[0]; body = body.slice(1); }
  const tm = /(ませんでした|ました|ません|ます|なかった|ない)$/.exec(body);
  let tail = tm ? tm[0] : ''; if (tail) body = body.slice(0, -tail.length);
  else if (body.length > 1) { tail = body.slice(-1); body = body.slice(0, -1); }   // huruf akhir (な, く, い, る, ん, dst.) tetap sama di semua pilihan
  if (!body || !/^[\u3041-\u309f\u30fc]+$/.test(body + tail)) return null;          // bukan hiragana murni -> pakai cara lama
  const seen = new Set([body]), out = [];
  for (let t = 0; t < 150 && out.length < 3; t++) { const m = mutateKana(body.split('')); if (!m) continue; const x = m.join(''); if (x && !seen.has(x)) { seen.add(x); out.push(x); } }
  return out.length === 3 ? sh([f, ...out.map(x => pre + x + tail)]) : null;
}
